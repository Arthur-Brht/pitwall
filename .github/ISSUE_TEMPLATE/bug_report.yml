name: Bug report
description: Report a reproducible Pitwall problem.
body:
  - type: markdown
    attributes:
      value: Do not attach credentials, session backups or private coordinates. Forecast disagreement by itself is not a software bug.
  - type: textarea
    id: behaviour
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Pitwall version, operating system, browser and Node.js version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Circuit, UTC valid time, source status and screenshots
      description: Include only information you are comfortable making public.
